<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Content Reader</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div class="app">
        <h1>Web Content Reader</h1>

        <label class="label">
            Mode
            <select id="mode">
                <option value="article">Article only</option>
                <option value="page">Full page</option>
                <option value="selection">Selected text</option>
            </select>
        </label>

        <label class="label">
            Voice
            <select id="voice"></select>
        </label>

        <label class="label">
            Speed: <span id="speedValue">1.0</span>x
            <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" />
        </label>

        <div class="row">
            <button id="read">Read</button>
            <button id="pause">Pause</button>
        </div>

        <div class="row">
            <button id="resume">Resume</button>
            <button id="stop">Stop</button>
        </div>

        <label class="checkbox">
            <input type="checkbox" id="autoScroll" checked />
            Auto scroll
        </label>

        <p class="hint">Tip: Select text on a page and choose “Selected text”.</p>
    </div>

    <script src="popup.js"></script>
</body>

</html>

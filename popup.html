<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Content Reader</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div class="app">

        <!-- Header with icon and title -->
        <header class="app-header">
            <img src="icon48.png" alt="Web Content Reader" class="app-icon" />
            <h1>Web Content Reader</h1>
        </header>

        <!-- Reading mode selector -->
        <label class="label" for="mode">
            Mode
            <select id="mode" aria-label="Reading mode">
                <option value="article">📄 Article only</option>
                <option value="page">📃 Full page</option>
                <option value="selection">✂️ Selected text</option>
            </select>
        </label>

        <!-- Voice selector -->
        <label class="label" for="voice">
            Voice
            <select id="voice" aria-label="Voice selection"></select>
        </label>

        <!-- Speed control -->
        <label class="label" for="speed">
            Speed: <span id="speedValue">1.0</span>x
            <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"
                   aria-label="Reading speed" />
        </label>

        <!-- Playback controls -->
        <div class="row">
            <button id="read" aria-label="Start reading">▶ Read</button>
            <button id="pause" aria-label="Pause reading">⏸ Pause</button>
        </div>

        <div class="row">
            <button id="resume" aria-label="Resume reading">⏯ Resume</button>
            <button id="stop" class="btn-stop" aria-label="Stop reading">⏹ Stop</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">Ready to read.</p>

        <!-- Auto-scroll toggle -->
        <label class="checkbox" for="autoScroll">
            <input type="checkbox" id="autoScroll" checked aria-label="Auto scroll" />
            Auto scroll
        </label>

        <!-- Tip -->
        <p class="hint">
            💡 Tip: Select text on a page and choose "Selected text".
        </p>
    </div>

    <script src="popup.js"></script>
</body>

</html>
